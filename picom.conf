# picom config -- pairs with the dwm rust/espresso theme (borderpx=2, gappx=8)

backend = "glx";
vsync = true;

# --- shadows: soft, warm, offset like light falling from above ---
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -10;
shadow-color = "#081208";
shadow-exclude = [
	"class_g = 'dwm'",
	"_GTK_FRAME_EXTENTS@"
];

# --- rounded corners: softens dwm's hard-tiled edges ---
corner-radius = 6;
rounded-corners-exclude = [
	"class_g = 'dwm'",
	# quickshell draws its own corners explicitly (including asymmetric
	# ones, like the wallpaper picker's square-top/round-bottom) -- picom's
	# automatic rounding would round the flush top corners too and fight it.
	"name = 'noctalia-qs'"
];
round-borders = 1;

# --- fading: gentle open/close instead of a hard pop ---
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 6;

# --- opacity: focused terminal stays readable but see-through; everything
# else fades back once it loses focus ---
inactive-opacity = 0.70;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# --- blur: dual_kawase behind any window that isn't fully opaque.
# strength is global (this compositor has no per-window blur radius), so
# bumping it here also deepens the blur on st/inactive windows below. ---
blur-background = true;
blur-background-fixed = true;
blur: {
	method = "dual_kawase";
	strength = 7;
};
# quickshell's full-screen invisible outside-click catchers report as
# window_type "dock" (same as its bar/launcher/etc overlays) -- without this
# exclusion, opening any bar dropdown blurs the entire desktop behind it.
blur-background-exclude = [
	"window_type = 'dock'"
];

opacity-rule = [
	"90:class_g = 'dwm'",
	"85:class_g = 'st-256color' && focused",
	# quickshell's popups (volume/notifications/power/calendar/wallpaper)
	# report as window_type "tooltip", which the wintypes block below
	# dims to 90% for real tooltips -- override that back to fully
	# opaque, matching the bar (window_type "dock", no such override),
	# by matching quickshell's shared _NET_WM_NAME instead of the type.
	"100:name = 'noctalia-qs'",
	"70:!focused"
];

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

wintypes:
{
	tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; };
	dock = { shadow = false; };
	dnd = { shadow = false; };
	popup_menu = { opacity = 0.95; };
	dropdown_menu = { opacity = 0.95; };
};
