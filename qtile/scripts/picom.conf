# Franck Picom Config#

# Corner
corner-radius = 7.5

# Blur
blur-background = True
blur:
{
  method = "dual_kawase";
  size = 10;
  strength = 5;
}

# Fading Option
fading = true;
fade-in-step = 0.013;
fade-out-step = 0.013;
fade-delta = 4; 

# Opacity
inactive-opacity-override = false;
active-opacity = 1.0;
inactive-opacity = 0.75;

opacity-rule = [
    #!focused = inactive, focused = active
  "60:class_g = 'kitty' && !focused",
  "75:class_g = 'kitty' && focused",
  "90:class_g = 'VSCodium' && focused",
  "90:class_g = 'Thunar' && focused",
  "85:class_g = 'vesktop' && focused",
]


# Other
backend = "glx"
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-client-opacity = true;